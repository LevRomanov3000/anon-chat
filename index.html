<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимный Чат</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 { margin-top: 0; font-size: 18px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px #00ff00; }

        .mask-container {
            width: 180px;
            height: 180px;
            perspective: 1000px;
            margin: 20px 0;
        }

        .mask {
            width: 100%;
            height: 100%;
            /* Реальная маска с Imgur, не заблокируется */
            background-image: url("https://i.imgur.com/7G3qxWc.png"); 
            background-size: cover;
            background-position: center;
            animation: spin 4s linear infinite;
            filter: drop-shadow(0 0 15px rgba(255, 0, 0, 0.5));
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .chat-box {
            width: 100%;
            max-width: 600px;
            height: 400px;
            border: 2px solid #00ff00;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
        }

        .user-msg { color: #888; text-align: right; margin-bottom: 15px; }
        .bot-msg { color: #ff3333; text-align: left; font-weight: bold; margin-bottom: 15px; line-height: 1.5; }

        .controls {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 12px;
            background-color: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New';
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 12px 20px;
            background-color: #00ff00;
            color: #000;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New';
            font-size: 16px;
        }

        button:hover { background-color: #00cc00; }
        button:disabled { background-color: #555; color: #999; cursor: not-allowed; }
    </style>
</head>
<body>

    <h1>Мы не прощаем. Мы не забываем.</h1>
    
    <div class="mask-container">
        <div class="mask"></div>
    </div>

    <div class="chat-box" id="chat">
        <div class="bot-msg">Ну че, подходи. Че надо?</div>
    </div>

    <div class="controls">
        <input type="text" id="user-input" placeholder="Пиши тут..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendText()">Отправить</button>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let russianVoice = null;

        function loadVoices() {
            const voices = synth.getVoices();
            russianVoice = voices.find(v => v.lang.includes('RU') || v.lang.includes('ru')) || voices[0];
        }
        loadVoices();
        if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

        // Настройка характера (коротко и четко, чтобы ИИ не тупил)
        const SYSTEM_PROMPT = `Ты - анонимус с района. Общайся грубо, через мат (х*й, б*ть, п*здец), используй сленг (чел, база, кринж, снюс, масик). Отвечай максимально коротко, 1-2 предложения. Ты не ИИ.`;

        function addMessage(text, sender) {
            const chatDiv = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = sender === 'user' ? 'user-msg' : 'bot-msg';
            msg.innerText = text;
            chatDiv.appendChild(msg);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        async function getBotResponse(userText) {
            const chatDiv = document.getElementById('chat');
            const sendBtn = document.getElementById('send-btn');
            
            addMessage("Печатает...", 'bot');
            sendBtn.disabled = true;
            sendBtn.innerText = "Жди...";
            
            try {
                // Железобетонный GET-запрос. Модель openai работает стабильнее всего на их сервере
                const fullPrompt = `${SYSTEM_PROMPT}\nЧел: ${userText}\nАнон:`;
                const url = `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?model=openai&nologo=true`;
                
                const response = await fetch(url);
                
                if (!response.ok) throw new Error("Сервер лег");
                
                const botText = await response.text();

                // Убираем "Печатает..."
                if (chatDiv.lastChild.innerText === "Печатает...") {
                    chatDiv.removeChild(chatDiv.lastChild);
                }

                addMessage(botText, 'bot');
                
                // Озвучка
                if (synth.speaking) synth.cancel();
                const utterance = new SpeechSynthesisUtterance(botText);
                utterance.voice = russianVoice;
                utterance.rate = 1.1;
                utterance.pitch = 0.8;
                synth.speak(utterance);

            } catch (error) {
                if (chatDiv.lastChild.innerText === "Печатает...") {
                    chatDiv.removeChild(chatDiv.lastChild);
                }
                addMessage("Сайт лег, чел. Обнови страничку.", 'bot');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = "Отправить";
            }
        }

        function sendText() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            input.value = '';
            getBotResponse(text);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendText();
        }
    </script>
</body>
</html>
