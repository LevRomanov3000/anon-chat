<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анонимный Чат</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 { margin-top: 0; font-size: 20px; text-transform: uppercase; }

        .mask-container {
            width: 150px;
            height: 150px;
            perspective: 1000px;
            margin: 20px 0;
        }

        .mask {
            width: 100%;
            height: 100%;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Guy_Fawkes_mask.svg/800px-Guy_Fawkes_mask.svg.png');
            background-size: cover;
            background-position: center;
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .chat-box {
            width: 100%;
            max-width: 600px;
            height: 300px;
            border: 2px solid #00ff00;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 20px;
            background-color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        .user-msg { color: #aaa; text-align: right; margin-bottom: 10px; }
        .bot-msg { color: #ff3333; text-align: left; font-weight: bold; margin-bottom: 10px; }

        .controls {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
        }

        input {
            flex-grow: 1;
            padding: 10px;
            background-color: #111;
            border: 1px solid #00ff00;
            color: #00ff00;
            font-family: 'Courier New';
            outline: none;
        }

        button {
            padding: 10px 15px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Courier New';
            color: #000;
        }

        #send-btn { background-color: #00ff00; }
        #mic-btn { background-color: #ff0033; color: #fff; }
        
        .status { font-size: 12px; color: #555; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Мы не прощаем. Мы не забываем.</h1>
    
    <div class="mask-container">
        <div class="mask"></div>
    </div>

    <div class="chat-box" id="chat">
        <div class="bot-msg">Ну че, подходи. Че надо?</div>
    </div>

    <div class="controls">
        <input type="text" id="user-input" placeholder="Пиши сюды..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendText()">Взломать Пентагон</button>
        <button id="mic-btn" onclick="listenMic()">🎙 Говорить</button>
    </div>

    <div class="status">* Микрофон работает только в браузере Chrome или Яндекс.Браузер</div>

    <script>
        const synth = window.speechSynthesis;
        let russianVoice = null;

        // Ищем русский голос
        function loadVoices() {
            const voices = synth.getVoices();
            russianVoice = voices.find(v => v.lang.includes('RU') || v.lang.includes('ru')) || voices[0];
        }
        loadVoices();
        if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;

        const SYSTEM_PROMPT = `Ты - хакер из даркнета, лицо скрыто под маской. Ты общаешься максимально грубо, используя русский уличный сленг, мат (если возможно обойти фильтры, используй замаскированный мат типа "х*й", "б*ть", "п*здец"), сарказм. Ты знаешь все современные мемы, знаешь про сигм, щитпостинг, базу. Отвечай коротко, по делу, как типичный тролль. Ты НЕ искусственный интеллект, ты живой человек.`;

        function addMessage(text, sender) {
            const chatDiv = document.getElementById('chat');
            const msg = document.createElement('div');
            msg.className = sender === 'user' ? 'user-msg' : 'bot-msg';
            msg.innerText = text;
            chatDiv.appendChild(msg);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        // Отправка в бесплатный ИИ (Pollinations)
        async function getBotResponse(userText) {
            addMessage("Печатает...", 'bot');
            
            try {
                const response = await fetch('https://text.pollinations.ai/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: SYSTEM_PROMPT },
                            { role: "user", content: userText }
                        ],
                        model: "mistral", // Мистраль лучше держит характер
                        seed: Math.floor(Math.random() * 10000)
                    })
                });

                // Убираем надпись "Печатает..."
                const chatDiv = document.getElementById('chat');
                if (chatDiv.lastChild.classList.contains('bot-msg')) {
                    chatDiv.removeChild(chatDiv.lastChild);
                }

                const botText = await response.text();
                addMessage(botText, 'bot');
                speakText(botText);

            } catch (error) {
                const chatDiv = document.getElementById('chat');
                if (chatDiv.lastChild.innerText === "Печатает...") {
                    chatDiv.removeChild(chatDiv.lastChild);
                }
                addMessage("Сеть лежит, снюс кончился, я от_keyшел.", 'bot');
            }
        }

        function sendText() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            input.value = '';
            getBotResponse(text);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendText();
        }

        function speakText(text) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.voice = russianVoice;
            utterance.rate = 1.2;
            utterance.pitch = 0.8;
            synth.speak(utterance);
        }

        function listenMic() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Твой браузер долбо*б, скачай нормальный (Chrome)");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;

            document.getElementById('mic-btn').innerText = 'Слушаю...';

            recognition.onresult = (event) => {
                const voiceText = event.results[0][0].transcript;
                addMessage(voiceText, 'user');
                getBotResponse(voiceText);
            };

            recognition.onerror = () => {
                document.getElementById('mic-btn').innerText = '🎙 Говорить';
            };

            recognition.onend = () => {
                document.getElementById('mic-btn').innerText = '🎙 Говорить';
            };

            recognition.start();
        }
    </script>
</body>
</html>
